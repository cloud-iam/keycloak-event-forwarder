name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: mvn --batch-mode --show-version verify
      - uses: actions/upload-artifact@v7
        with:
          name: keycloak-event-forwarder
          path: target/keycloak-event-forwarder.jar

  # Compiles and unit-tests against every supported Keycloak minor. The floor is 26.3: the replay
  # endpoint uses the fine-grained admin permissions API, which does not exist before it.
  compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        keycloak: [ '26.3.5', '26.4.7', '26.5.7', '26.6.4', '26.7.3' ]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - run: mvn --batch-mode verify -Dkeycloak.version=${{ matrix.keycloak }}
