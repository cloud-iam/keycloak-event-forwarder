name: release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # The tag is the single source of truth for the version: v1.2.3 builds 1.2.3. The POM stays on
      # -SNAPSHOT on the branch, so releasing never needs a version-bump commit.
      - name: Set the version from the tag
        run: >
          mvn --batch-mode
          org.codehaus.mojo:versions-maven-plugin:2.20.1:set
          -DnewVersion=${GITHUB_REF_NAME#v} -DgenerateBackupPoms=false

      - run: mvn --batch-mode --show-version verify

      - name: Publish the release with the provider jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            target/keycloak-event-forwarder.jar
